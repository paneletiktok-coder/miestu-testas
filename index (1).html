<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuris pasaulio miestas labiausiai tinka tavo asmenybei? | Panelė</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#fff;color:#25232a;font-family:Arial,Helvetica,sans-serif;line-height:1.55}.quiz{max-width:700px;margin:0 auto;padding:8px}.card{border:1px solid #eee4e9;background:#fffafc;border-radius:18px;padding:28px}.kicker{font-size:12px;letter-spacing:2px;color:#a75e7e;font-weight:700;text-transform:uppercase}h1,h2{line-height:1.2;color:#29232a}h1{font-size:28px;margin:12px 0}h2{font-size:35px;margin:12px 0;color:#a85d80}.subtitle{color:#736a70;margin:0 0 24px}.progress{height:7px;background:#f0dce5;border-radius:20px;overflow:hidden;margin:16px 0 24px}.bar{height:100%;width:0;background:#bb7293;transition:width .25s}.question{font-size:20px;font-weight:700;margin:12px 0 20px}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e9dbe2;border-radius:11px;padding:14px 17px;margin:0 0 10px;font-size:15px;line-height:1.45;color:#25232a;cursor:pointer}.option:hover,.option:focus-visible{background:#fbeef4;border-color:#bc7e9a}.option.selected{background:#f5dce7;border:2px solid #a65b7c;padding:13px 16px;font-weight:700}.button{background:#a85d80;color:#fff;border:0;padding:13px 20px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:700}.button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:transparent;color:#8e5470;border:1px solid #d6a8bc}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.result{text-align:center}.result p{font-size:16px;line-height:1.75}.hidden{display:none!important}.disclaimer{font-size:12px;color:#8a8087;margin:20px 0 0}@media(max-width:480px){.quiz{padding:4px}.card{padding:20px}h1{font-size:24px}.question{font-size:18px}.option{font-size:14px}h2{font-size:30px}}
</style>
</head>
<body>
<main class="quiz"><section class="card" aria-label="Miestų asmenybės testas">
<div id="intro"><div class="kicker">PANELĖ | ASMENYBĖS TESTAS</div><h1>Kuriame pasaulio mieste turėtum gyventi?</h1><p class="subtitle">Paryžius, Niujorkas, o gal Tokijas? Atsakyk į 6 klausimus ir sužinok, kuris miestas geriausiai atitinka tavo asmenybę.</p><button class="button" id="start" type="button">Pradėti testą →</button></div>
<div id="game" class="hidden"><div class="kicker" id="count"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div id="options" role="group" aria-label="Pasirink vieną atsakymą"></div><div class="actions"><button class="button secondary" id="back" type="button">← Atgal</button><button class="button" id="next" type="button" disabled>Toliau →</button></div></div>
<div id="result" class="result hidden" aria-live="polite"><div class="kicker">TAVO REZULTATAS</div><h2 id="city"></h2><p id="description"></p><button class="button" id="restart" type="button">Atlikti testą iš naujo</button></div>
<p class="disclaimer">Pramoginis testas, o ne mokslinis asmenybės vertinimas.</p>
</section></main>
<script>
(()=>{
const questions=[
{question:'Kaip atrodytų tavo idealus šeštadienis?',options:[['Paryžius','Knygynas, meno galerija ir ilgas pokalbis kavinėje.'],['Niujorkas','Dieną milijonas reikalų, vakare – koncertas ar vakarėlis.'],['Berlynas','Blusturgis, vinilinės plokštelės ir netikėtas nuotykis.'],['Kopenhaga','Pasivažinėjimas dviračiu ir jaukus vakaras namuose.'],['Roma','Ilgi pietūs su draugais ir spontaniški planai.'],['Tokijas','Naujų rajonų, parduotuvių ir neįprastų vietų atradimas.']]},
{question:'Kokia aplinka tave labiausiai įkvepia?',options:[['Kopenhaga','Šviesūs interjerai, parkai ir ramios gatvės.'],['Tokijas','Neoninės šviesos, technologijos ir kontrastai.'],['Roma','Istoriniai pastatai, šurmulys ir saulėtos aikštės.'],['Berlynas','Gatvės menas, alternatyvūs barai ir kūrybinės erdvės.'],['Paryžius','Senos bibliotekos, muziejai ir jaukios kavinės.'],['Niujorkas','Dangoraižiai, judrios gatvės ir didmiesčio energija.']]},
{question:'Koks tavo santykis su rutina?',options:[['Niujorkas','Nuolat ieškau naujų iššūkių.'],['Paryžius','Mėgstu kasdienius ritualus, bet palieku vietos įkvėpimui.'],['Kopenhaga','Vertinu stabilumą ir gyvenimo balansą.'],['Berlynas','Taisyklės? Geriau pati susikursiu savas.'],['Tokijas','Mėgstu tvarką, bet noriu nuolat atrasti kažką naujo.'],['Roma','Man patinka spontaniškumas ir lankstūs planai.']]},
{question:'Ką labiausiai vertini žmonėse?',options:[['Roma','Šilumą, atvirumą ir humoro jausmą.'],['Berlynas','Originalumą ir drąsą būti savimi.'],['Niujorkas','Ambicijas ir energiją.'],['Paryžius','Smalsumą, kūrybiškumą ir gilias diskusijas.'],['Tokijas','Dėmesingumą ir pagarbą kitiems.'],['Kopenhaga','Nuoširdumą, paprastumą ir patikimumą.']]},
{question:'Koks būtų tavo svajonių darbas?',options:[['Berlynas','Nepriklausomo muzikos ar mados projekto kūrėja.'],['Paryžius','Leidyklos redaktorė arba meno kuratorė.'],['Tokijas','Technologijų ar inovacijų specialistė.'],['Roma','Kūrybinės erdvės ar nedidelio verslo savininkė.'],['Niujorkas','Tarptautinės kūrybinės agentūros vadovė.'],['Kopenhaga','Dizainerė, dirbanti lanksčiu grafiku.']]},
{question:'Ko labiausiai norėtum iš gyvenimo naujame mieste?',options:[['Tokijas','Kasdien atrasti tai, ko dar nesu mačiusi.'],['Kopenhaga','Jausti ramybę ir turėti daugiau laiko sau.'],['Paryžius','Semtis įkvėpimo iš meno, žmonių ir aplinkos.'],['Niujorkas','Išnaudoti visas galimybes ir siekti didelių tikslų.'],['Roma','Daugiau džiaugsmo, artumo ir spontaniškumo.'],['Berlynas','Laisvės eksperimentuoti ir gyventi savaip.']]}
];
const results={
'Paryžius':'Esi kūrybiška, smalsi ir pastebi grožį net mažiausiose kasdienybės detalėse. Tave traukia menas, literatūra ir ilgi pokalbiai. Tau patiktų gyvenimas, kuriame visada atsiranda laiko užsukti į muziejų ar atrasti naują knygyną.',
'Niujorkas':'Esi ambicinga, energinga ir mėgsti jausti, kad gyvenimas juda pirmyn. Tave įkvepia galimybės, nauji žmonės ir dideli tikslai. Miestas, kuris niekada nemiega, atitiktų tavo tempą ir norą nuolat augti.',
'Berlynas':'Vertini nepriklausomybę, originalumą ir laisvę eksperimentuoti. Nemėgsti būti įsprausta į rėmus, todėl tave trauktų miesto alternatyvioji kultūra, muzika, menas ir žmonės, kurie nebijo išsiskirti.',
'Kopenhaga':'Tau svarbus balansas, jaukumas ir estetiška aplinka. Vertini mažus kasdienius malonumus, laiką su artimaisiais ir galimybę neskubėti. Tau patiktų gyvenimas, kuriame gera kava ir pasivažinėjimas dviračiu yra tokie pat svarbūs kaip dideli planai.',
'Roma':'Esi spontaniška, šilta ir mėgsti gyvenimą, kuriame netrūksta emocijų. Tau svarbūs žmonės, maistas, ilgi pokalbiai ir netikėti nuotykiai. Romos gatvės, gyvybingos aikštės ir itališkas gyvenimo ritmas galėtų tapti tavo kasdienybe.',
'Tokijas':'Esi smalsi, atvira naujovėms ir mėgsti atrasti neįprastus dalykus. Tave žavi kultūrų kontrastai, mada, technologijos ir nuolat besikeičianti aplinka. Tokijas suteiktų progą kiekvieną dieną patirti kažką naujo.'};
const $=id=>document.getElementById(id);let current=0;let answers=Array(questions.length).fill(null);
function show(section){['intro','game','result'].forEach(id=>$(id).classList.toggle('hidden',id!==section));}
function render(){const q=questions[current];$('count').textContent=`KLAUSIMAS ${current+1} IŠ ${questions.length}`;$('bar').style.width=`${(current+1)/questions.length*100}%`;$('question').textContent=q.question;$('options').replaceChildren();q.options.forEach((entry,index)=>{const button=document.createElement('button');button.type='button';button.className='option'+(answers[current]===index?' selected':'');button.textContent=entry[1];button.setAttribute('aria-pressed',String(answers[current]===index));button.addEventListener('click',()=>{answers[current]=index;render();});$('options').appendChild(button);});$('back').style.visibility=current===0?'hidden':'visible';$('next').disabled=answers[current]===null;$('next').textContent=current===questions.length-1?'Pamatyti rezultatą →':'Toliau →';}
function calculate(){const scores=Object.create(null),first=Object.create(null);questions.forEach((q,i)=>{const city=q.options[answers[i]][0];scores[city]=(scores[city]||0)+1;if(first[city]===undefined)first[city]=i;});const winner=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]||first[a]-first[b])[0];$('city').textContent=winner;$('description').textContent=results[winner];show('result');}
$('start').addEventListener('click',()=>{current=0;answers.fill(null);show('game');render();});$('next').addEventListener('click',()=>{if(answers[current]===null)return;if(current<questions.length-1){current++;render();}else calculate();});$('back').addEventListener('click',()=>{if(current>0){current--;render();}});$('restart').addEventListener('click',()=>{current=0;answers.fill(null);show('intro');});
})();
</script>
</body>
</html>
